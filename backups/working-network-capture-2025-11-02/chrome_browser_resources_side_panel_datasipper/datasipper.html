<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>DataSipper</title>
  <link rel="stylesheet" href="datasipper.css">
</head>
<body>
  <div class="container">
    <h1>DataSipper</h1>
    <p>Real-time data extraction and streaming</p>

    <div class="section">
      <h2>Current Page Data</h2>
      <div id="pageData">
        <p>Monitoring current page for structured data...</p>
      </div>
    </div>

    <div class="section">
      <h2>Extraction Config</h2>
      <div class="config">
        <label>
          <input type="checkbox" id="jsonEnabled" checked>
          Extract JSON
        </label>
        <label>
          <input type="checkbox" id="websocketsEnabled" checked>
          Monitor WebSockets
        </label>
        <label>
          <input type="checkbox" id="apiEnabled" checked>
          Track API Calls
        </label>
      </div>
    </div>

    <div class="section">
      <h2>Streaming Status</h2>
      <div id="status" class="status">
        <span class="status-indicator"></span>
        <span>Ready</span>
      </div>
    </div>

    <div class="section">
      <h2>Network Activity</h2>
      <div id="networkRequests" class="network-list">
        <p class="empty-state">Waiting for network activity...</p>
      </div>
    </div>
  </div>
  <script type="module" src="datasipper.js"></script>
</body>
</html>
